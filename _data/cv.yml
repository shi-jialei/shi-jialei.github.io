cv:
  name: Jialei Shi
  label: Postdoctoral Research Associate
  email: j.shi@imperial.ac.uk

  sections:

    Experience:

      - company: Imperial College London
        position: Research Associate
        location: London, United Kingdom
        start_date: 2024-03
        end_date: present
        summary: >
          Conducting research in soft robotic endoscopy, medical robotics,
          robot intelligence, and translational healthcare technologies.

        highlights:
          - Led the development of a soft robotic colonoscope from concept to in vivo validation.
          - Coordinated multidisciplinary collaborations involving engineers, clinicians, and industry partners.
          - Published first-author papers in IEEE Transactions on Robotics and secured a UK patent.
          - Awarded £70,000 UKRI Impact Acceleration Account funding as Researcher Co-Investigator (Co-applicant).
          - Supervised undergraduate, MSc, and PhD researchers.

      - company: University College London
        position: Research Assistant
        location: London, United Kingdom
        start_date: 2022-11
        end_date: 2023-11
        summary: >
          Developed a wearable soft robotic haptic interface for tactile
          perception restoration and clinical neuroscience.

        highlights:
          - Designed and integrated a portable soft haptic device.
          - Designed and conducted human-participant studies with clinical collaborators.
          - Delivered a TRL-5 prototype that received national media coverage.

      - company: Inria, University of Lille
        position: Visiting Researcher
        location: Lille, France
        start_date: 2023-06
        end_date: 2023-08
        summary: >
          Developed reduced-order finite-element models and closed-loop control
          for miniaturised soft robotic manipulators.

        highlights:
          - Awarded a UK Turing Scheme Mobility Grant.
          - Developed reduced-order finite-element models and digital-twin simulations.
          - Co-authored an IEEE RoboSoft publication.

    Education:

      - institution: University College London
        location: London, United Kingdom
        area: Mechatronic and Robotic Engineering
        studyType: PhD
        start_date: 2019-09
        end_date: 2024-02
        courses: >
          Thesis: Static Modelling and Control for Pneumatic-Driven Soft Continuum Robots

        highlights:
          - Developed analytical modelling and control frameworks for soft continuum robots.
          - Designed miniature fibre-reinforced soft manipulators.
          - Awarded a £140,000 departmental scholarship.
          - Selected for RSS Pioneers 2024.
          - Awarded the UCL Dean's Prize Research Scholarship.
          - Received the UCL Mechanical Engineering Highly Commended PhD Thesis Award.

      - institution: Beijing Institute of Technology
        location: Beijing, China
        studyType: Master of Engineering
        start_date: 2017-09
        end_date: 2019-06

        highlights:
          - Conducted research at Tsinghua University as a visiting master's student.
          - Awarded the First Prize Postgraduate Scholarship.

      - institution: Harbin Institute of Technology
        location: Weihai, China
        studyType: Bachelor of Engineering
        start_date: 2013-09
        end_date: 2017-06

        highlights:
          - Ranked first for graduate-school recommendation.
          - Served as Team Leader of the HIT Racing Team.
          - Won the Formula Student Electric China Championship.
          - Received the Best Electrical System Design Award at Student Formula Japan.

