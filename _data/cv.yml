    Research Grants:
      - name: Self-propelled Robotic Endoscope
        summary: UKRI Impact Acceleration Account funding totalling £70,000.
        highlights:
          - Researcher Co-Investigator and co-applicant.
          - Led proposal conception and development.
        start_date: 2026-02
        end_date: 2027-02

      - name: Bounce Control of Soft Spherical Robots for Obstacle Crossing
        summary: >
          Imperial Dame Julia Higgins Postdoctoral Collaborative Research Fund
          award totalling £4,950.
        highlights:
          - Co-Investigator.
          - Contributed to proposal conception and development.
        start_date: 2025-08
        end_date: 2026-08

      - name: Reduced-Order Finite Element Modelling and Control of Soft Robots
        summary: UK Turing Scheme Mobility Grant totalling £1,100.
        highlights:
          - Principal applicant.
          - Supported collaborative research at Inria Lille on modelling and control of soft robots.
        start_date: 2023-06
        end_date: 2023-09
        
    Professional Service:
      - name: Peer review
        summary: >
          Reviewer for The International Journal of Robotics Research, IEEE Transactions 
          on Robotics, IEEE Robotics and Automation Letters, IEEE/ASME Transactions on Mechatronics, 
          Soft Robotics, Hamlyn Symposium on Medical Robotics, ICRA, IROS, and RoboSoft; 
          reviewer for the EPSRC New Investigator Award.
        start_date: 2019-09
